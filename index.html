<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banner Landing Page</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #151922;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #ffffff;
      }

      main {
        width: min(100%, 1140px);
        margin: 0 auto;
        padding: 0;
      }

      .banner-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .banner-item {
        width: 100%;
      }

      .banner-item img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
